name: optimized
description: >-
  Tuned combined config. Keeps the levers that measured as free (guarded cache, downshift), uses a
  gentler context budget (rerank, keep top 5 within 750 words) and leaves compression off, since
  on its own it cost a small but significant amount of quality. This is the file a PR changes;
  the eval gate checks it against `naive`.
default_tier: strong
cache: {exact: true, semantic: true, threshold: 0.84, number_guard: true, verify_model: gemini-lite}
retrieval: {enabled: true, chunk_words: 150, overlap_words: 30, top_k: 8}
context: {rerank: true, keep: 5, max_context_words: 750}
compression: {enabled: false}
downshift:
  enabled: true
  rules:
    - {name: pasted-text-needs-strong, tier: strong, has_user_context: true}
    - {name: numbers-need-strong, tier: strong, numeric_reasoning: true}
    - {name: everything-else-cheap, tier: cheap}
