name: optimized
description: >-
  First combined config: guarded cache + rerank to top 3 within 450 words + compression to ~60% +
  downshift. Saves the most tokens, but the context and compression ablations show it costs
  answer quality, so the eval gate blocks it. Kept to show what the gate catches.
default_tier: strong
cache: {exact: true, semantic: true, threshold: 0.84, number_guard: true, verify_model: gemini-lite}
retrieval: {enabled: true, chunk_words: 150, overlap_words: 30, top_k: 8}
context: {rerank: true, keep: 3, max_context_words: 450}
compression: {enabled: true, target_ratio: 0.6}
downshift:
  enabled: true
  rules:
    - {name: pasted-text-needs-strong, tier: strong, has_user_context: true}
    - {name: numbers-need-strong, tier: strong, numeric_reasoning: true}
    - {name: everything-else-cheap, tier: cheap}
