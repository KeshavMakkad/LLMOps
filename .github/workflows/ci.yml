name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {FRUGAL_FAKE_EMBED: "1", FRUGAL_FAKE_LLM: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,ui]"
      - run: ruff check frugal tests dashboard scripts loadtest
      - run: frugal validate
      - run: pytest -q
      - name: Offline end-to-end replay (fake models, $0)
        run: frugal run optimized --max-groups 12 --out /tmp/offline.json
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frugal .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name frugal-smoke frugal
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && exit 0; sleep 1; done
          docker logs frugal-smoke; exit 1
