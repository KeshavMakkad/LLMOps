# Any PR that touches the optimisation policy, prompt or gate thresholds must prove quality holds:
# replay a stratified 24-group slice of the trace through `naive` and the PR's `optimized`, judge
# both, and fail the check on a significant quality drop, too many false cache hits, or lost savings.
name: eval-gate
on:
  pull_request:
    paths:
      - "configs/**"
      - "frugal/cache.py"
      - "frugal/context.py"
      - "frugal/router.py"
      - "frugal/pipeline.py"
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRUGAL_CACHE_BACKEND: postgres   # shared response cache: naive's half is ~free on every PR
      FASTEMBED_CACHE_PATH: ~/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            .frugal/embeddings.sqlite
          key: frugal-index-${{ hashFiles('data/**') }}
      - run: frugal build-index
      - name: Eval gate
        run: frugal gate optimized --max-groups 24 --summary-md gate.md
      - name: Comment on PR
        if: always() && hashFiles('gate.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: gate.md
          header: frugal-gate
