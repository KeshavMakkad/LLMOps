[project]
name = "frugal"
version = "0.1.0"
description = "Drop-in LLM cost-optimisation layer (semantic cache, prompt compression, context management, model downshift) with eval-gated quality bounds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.20",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "fastembed>=0.4",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=8.3",
  "prometheus-client>=0.20",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
tracing = ["langfuse>=2.50,<3"]
ui = ["streamlit>=1.36", "pandas>=2.2", "plotly>=5.22", "requests>=2.32"]
dev = ["pytest>=8.2", "ruff>=0.5", "locust>=2.29"]

[project.scripts]
frugal = "frugal.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frugal*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
